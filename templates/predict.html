
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Loan Approval Prediction</h1>

        <p>Enter applicant details to predict loan approval.</p>

        <form action="/predict" method="POST">

            <label>Age</label>
            <input type="number"
                   name="person_age"
                   min="18"
                   required>

            <label>Annual Income (in USD $)</label>
            <input type="number"
                   name="person_income"
                   min="1"
                   step="any"
                   placeholder="Example: 50000"
                   required>

            <label>Employment Experience (years)</label>
            <input type="number"
                   name="person_emp_exp"
                   min="0"
                   required>

            <label>Loan Amount (in USD $)</label>
            <input type="number"
                   name="loan_amnt"
                   min="1"
                   step="any"
                   placeholder="Example: 10000"
                   required>

            <label>Loan Interest Rate (%)</label>
            <input type="number"
                   name="loan_int_rate"
                   min="0"
                   max="100"
                   step="any"
                   required>

            <label>Credit History Length (years)</label>
            <input type="number"
                   name="cb_person_cred_hist_length"
                   min="0"
                   step="any"
                   required>

            <label>Credit Score</label>
            <input type="number"
                   name="credit_score"
                   min="300"
                   max="850"
                   required>

            <label>Gender</label>
            <select name="person_gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Education</label>
            <select name="person_education" required>
                <option value="">Select Education</option>
                <option value="Associate">Associate</option>
                <option value="Bachelor">Bachelor</option>
                <option value="Doctorate">Doctorate</option>
                <option value="High School">High School</option>
                <option value="Master">Master</option>
            </select>

            <label>Home Ownership</label>
            <select name="person_home_ownership" required>
                <option value="">Select Home Ownership</option>
                <option value="RENT">Rent</option>
                <option value="MORTGAGE">Mortgage</option>
                <option value="OWN">Own</option>
                <option value="OTHER">Other</option>
            </select>

            <label>Loan Intent</label>
            <select name="loan_intent" required>
                <option value="">Select Loan Intent</option>
                <option value="DEBTCONSOLIDATION">Debt Consolidation</option>
                <option value="EDUCATION">Education</option>
                <option value="HOMEIMPROVEMENT">Home Improvement</option>
                <option value="MEDICAL">Medical</option>
                <option value="PERSONAL">Personal</option>
                <option value="VENTURE">Venture</option>
            </select>

            <label>Previous Loan Defaults</label>
            <select name="previous_loan_defaults_on_file" required>
                <option value="">Select Option</option>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>

            <button type="submit">Predict Loan Status</button>

        </form>

    </div>

</body>
</html>
